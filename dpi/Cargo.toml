[package]
name = "flint-dpi"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
nfq = "0.2"
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
pcap = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windivert = "0.2"

[lib]
name = "flint_dpi"
crate-type = ["staticlib", "cdylib", "rlib"]
